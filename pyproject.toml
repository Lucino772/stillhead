[project]
name = "stillhead"
version = "0.1.0"
description = "Alembic migrations for modules that share one database, each with its own tables, revisions and version table."
readme = "README.md"
authors = [{ name = "Lucino772" }]
requires-python = ">=3.10"
# No web framework: a release step must not need one to run a migration.
# SQLAlchemy is listed because stillhead imports it directly.
dependencies = ["alembic>=1.13", "sqlalchemy>=2.0"]

[project.scripts]
stillhead = "stillhead._internal.cli:main"

# Tells PyInstaller where the stillhead hook is. PyInstaller is not a runtime
# dependency.
[project.entry-points.pyinstaller40]
hook-dirs = "stillhead.__pyinstaller:get_hook_dirs"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

# psycopg and testcontainers run the Postgres tests, and pyinstaller runs the
# bundle tests. These tests are skipped when Docker or PyInstaller is missing.
[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pyright[nodejs]>=1.1.409",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "psycopg[binary]>=3.1",
    "testcontainers[postgres]>=4.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With -n, keep each test file on one worker, so that the Postgres container and
# the PyInstaller build are made once. Without it, -n is slower than a serial run.
addopts = ["--dist", "loadfile"]
markers = [
    "integration: opens a real database engine, or builds and runs a bundle.",
]
# Stop the run when one test takes more than 300 seconds, including its fixtures.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

# See https://microsoft.github.io/pyright/#/configuration
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.*", ".venv", "**/__pycache__", "**/dist", "**/build", "docs"]
venvPath = "."
venv = ".venv"
# The test fixture packages are on sys.path, not installed.
extraPaths = ["tests/fixtures"]
# Check against the oldest Python version that stillhead supports.
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportUnusedVariable = "error"
reportUnusedClass = "error"
reportUnusedExpression = "error"
reportUnusedCoroutine = "error"

# See https://docs.astral.sh/ruff/rules/
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

# These rules are added to the default rules of ruff.
[tool.ruff.lint]
extend-select = [
    "I",      # sorted imports
    "RUF022", # sorted __all__
    "RUF023", # sorted __slots__
    "W291",   # trailing whitespace
    "W292",   # no newline at end of file
    "W293",   # whitespace on a blank line
    "W605",   # invalid escape sequence
    "TC",     # imports for type checking only go under TYPE_CHECKING
    "FA",     # from __future__ import annotations
    "C4",     # simpler comprehensions
    "PYI",    # typing issues
    "COM818", # trailing comma on a bare tuple
]

[tool.ruff.lint.per-file-ignores]
# PyInstaller finds a hook by its file name, so the name cannot change.
"**/__pyinstaller/hook-*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["stillhead"]
